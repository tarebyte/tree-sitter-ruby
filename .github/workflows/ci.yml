name: CI

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - tools/**
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/**
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - tools/**
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/**

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Set up examples
        uses: actions/checkout@v4
        with:
          repository: ruby/spec
          ref: f84b436ec2f461e9aeef4d70e59875d902ea28d0
          path: examples/ruby_spec
      - name: Run tests
        uses: tree-sitter/parser-test-action@v2
        with:
          test-rust: true
          test-node: true
          test-python: true
          test-go: true
          test-swift: true
      - name: Parse examples
        uses: tree-sitter/parse-action@v4
        with:
          files: |
            examples/*.rb
            !examples/ruby_spec/command_line/fixtures/bad_syntax.rb
            !examples/ruby_spec/command_line/fixtures/freeze_flag_required_diff_enc.rb
            !examples/ruby_spec/core/enumerable/shared/inject.rb
            !examples/ruby_spec/language/fixtures/freeze_magic_comment_required_diff_enc.rb
            !examples/ruby_spec/language/string_spec.rb
            !examples/ruby_spec/core/proc/ruby2_keywords_spec.rb
            !examples/ruby_spec/language/fixtures/utf16-be-nobom.rb
            !examples/ruby_spec/language/fixtures/utf16-le-nobom.rb
            !examples/ruby_spec/language/lambda_spec.rb

  prism:
    name: Test Prism conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check out Ruby Spec
        uses: actions/checkout@v4
        with:
          repository: ruby/spec
          ref: f84b436ec2f461e9aeef4d70e59875d902ea28d0
          path: examples/ruby_spec
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test focused conformance
        run: cargo test --locked --manifest-path tools/prism-conformance/Cargo.toml
      - name: Test Ruby Spec conformance
        env:
          PRISM_RUBY_SPEC_ROOT: examples/ruby_spec
        run: >-
          cargo test --locked
          --manifest-path tools/prism-conformance/Cargo.toml
          --test conformance ruby_spec_matches_prism
          -- --ignored --nocapture
